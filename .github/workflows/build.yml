name: Build app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: excel_converter-windows
          - os: macos-14            # Apple silicon (arm64)
            artifact: excel_converter-mac-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      # No arguments => the app opens file pickers (choose the time clock file, and the chart on first run).
      - name: Build excel_converter.exe (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name excel_converter excel_converter.py

      - name: Build excel_converter.app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name excel_converter excel_converter.py
          ditto -c -k --keepParent dist/excel_converter.app dist/excel_converter-mac-silicon.zip

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/excel_converter.exe

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/excel_converter-mac-silicon.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/excel_converter-windows/excel_converter.exe
            artifacts/excel_converter-mac-silicon/excel_converter-mac-silicon.zip
